name: Deploy LinkPulse

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload sources
        run: |
          rsync -avz --exclude='node_modules' --exclude='.git' --exclude='dist' --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            . root@${{ secrets.VPS_HOST }}:/opt/linkpulse/

      - name: Build and restart
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'EOF'
          set -e
          cd /opt/linkpulse
          docker compose up -d --build --force-recreate app
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/api/health >/dev/null; then break; fi
            [ "$attempt" -lt 30 ] || { echo "Health check failed"; exit 1; }
            sleep 2
          done
          echo "Deploy complete"
          EOF

      - name: Notify Telegram
        if: success()
        run: |
          COMMITS=$(git log --oneline -5 --format="• %s" | head -5)
          MSG="🔗 *LinkPulse deployed*%0A%0A${COMMITS}%0A%0A🔗 [Open](https://cheslav.space/linkpulse/)"
          curl -s "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=@linkpulse_dev" \
            -d "text=$MSG" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"

      - name: Notify n8n (LinkedIn draft pipeline)
        if: success() && env.N8N_LINKEDIN_WEBHOOK != ''
        env:
          N8N_LINKEDIN_WEBHOOK: ${{ secrets.N8N_LINKEDIN_WEBHOOK }}
        run: |
          COMMITS_JSON=$(git log -5 --format='%s' | jq -R . | jq -s -c .)
          PAYLOAD=$(jq -c -n \
            --arg project "linkpulse" \
            --arg repo "https://github.com/${{ github.repository }}" \
            --arg deploy "https://cheslav.space/linkpulse/" \
            --argjson commits "$COMMITS_JSON" \
            '{project:$project, repo_url:$repo, deploy_url:$deploy, commits:$commits}')
          curl -fsS -X POST "$N8N_LINKEDIN_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" || true
