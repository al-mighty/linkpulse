name: Deploy LinkPulse

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload sources
        run: |
          rsync -avz --exclude='node_modules' --exclude='.git' --exclude='dist' --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            . root@${{ secrets.VPS_HOST }}:/opt/linkpulse/

      - name: Build and restart
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'EOF'
          cd /opt/linkpulse
          docker compose up -d --build --force-recreate app
          sleep 3
          curl -sf http://localhost:8080/api/health || echo "Health check failed"
          docker restart cheslav-nginx
          echo "Deploy complete"
          EOF

      - name: Notify Telegram
        if: success()
        run: |
          COMMITS=$(git log --oneline -5 --format="• %s" | head -5)
          MSG="🔗 *LinkPulse deployed*%0A%0A${COMMITS}%0A%0A🔗 [Open](https://cheslav.space/linkpulse/)"
          curl -s "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=@linkpulse_dev" \
            -d "text=$MSG" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
