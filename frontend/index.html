<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkPulse — URL Shortener with Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script async src="https://cheslav.space/survivors/feedback/widget.js" data-project="linkpulse"></script>

  <script async src="https://cheslav.space/linkpulse/track.js" data-project="linkpulse"></script>
</body>
