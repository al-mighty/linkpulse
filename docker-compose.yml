services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linkpulse
      POSTGRES_USER: linkpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkpulse"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      default:
        aliases:
          - lp-db
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks:
      default:
        aliases:
          - lp-redis
    restart: always

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://linkpulse:${POSTGRES_PASSWORD:-linkpulse}@lp-db:5432/linkpulse?sslmode=disable
      REDIS_URL: redis://redis:6379
      PORT: "8080"
      BASE_URL: ${BASE_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
      - cheslav-net
    restart: always

volumes:
  pgdata:

networks:
  cheslav-net:
    external: true